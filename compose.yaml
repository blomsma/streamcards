name: event-streamcards
services:
  streamcards:
    image: event-streamcards:3.0.0
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8787}:3001"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  app_data:
